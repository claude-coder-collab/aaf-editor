name: Full

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/full.yml"

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitizers-and-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          pip install -r tools/requirements.txt
      - uses: actions/cache@v4
        with:
          path: tests/fixtures/external
          key: fixtures-${{ hashFiles('tests/fixtures/external/manifest.json') }}
      - name: Fetch external fixtures
        run: python tools/fetch_fixtures.py
      - name: Build (ASan/UBSan)
        run: |
          cmake --preset clang-asan -DCMAKE_CXX_COMPILER=clang++-22 -DAAF_BUILD_EDITOR=OFF
          cmake --build build/clang-asan --config Debug
      - name: Test (ASan/UBSan, all fixtures)
        run: ctest --test-dir build/clang-asan -C Debug --output-on-failure
      - name: Cross-check containers with pyaaf2
        run: python tools/crosscheck_cfb.py build/clang-asan/apps/aaftool/Debug/aaftool
      - name: Cross-check objects with pyaaf2
        run: python tools/crosscheck.py build/clang-asan/apps/aaftool/Debug/aaftool
      - name: Cross-check round-tripped files with pyaaf2
        run: python tools/crosscheck.py --roundtrip build/clang-asan/apps/aaftool/Debug/aaftool
      - name: Cross-check embedded essence with pyaaf2
        run: python tools/crosscheck.py --essence build/clang-asan/apps/aaftool/Debug/aaftool
      - name: Cross-check timeline edits with pyaaf2 and OTIO
        run: python tools/crosscheck_edits.py build/clang-asan/apps/aaftool/Debug/aaftool

  performance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          pip install -r tools/requirements.txt
      - name: Build aaftool (Release)
        run: |
          cmake --preset gcc -DCMAKE_CXX_COMPILER=g++-14 -DAAF_BUILD_EDITOR=OFF
          cmake --build build/gcc --config Release --target aaftool
      - name: Generate the stress file
        run: |
          python - <<'PY'
          import json, subprocess, sys
          f = json.load(open("tools/perf_limits.json"))["file"]
          subprocess.run([sys.executable, "tools/gen_stress_aaf.py", "stress.aaf", *[a for k, v in f.items() for a in (f"--{k}", str(v))]], check=True)
          PY
      - name: Core performance limits
        run: python tools/perf_baseline.py build/gcc/apps/aaftool/Release/aaftool stress.aaf --limits tools/perf_limits.json
      - name: Timeline drawing limits
        working-directory: ui
        env:
          AAFTOOL: ../build/gcc/apps/aaftool/Release/aaftool
          AAF_PERF_FILE: ../stress.aaf
          AAF_PERF_LIMITS: ../tools/perf_limits.json
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
          npm run e2e -- perf --project chromium

  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
      - name: Build (TSan)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          cmake --preset clang-tsan -DCMAKE_CXX_COMPILER=clang++-22 -DAAF_BUILD_EDITOR=OFF
          cmake --build build/clang-tsan --config Debug
      - name: Test (TSan)
        run: ctest --test-dir build/clang-tsan -C Debug --output-on-failure

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
      - name: Build fuzzers
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          cmake --preset clang-fuzz -DCMAKE_CXX_COMPILER=clang++-22
          cmake --build build/clang-fuzz --config Debug
      - name: Seed corpus
        run: |
          mkdir corpus
          find tests/fixtures/aafsdk -name '*.aaf' -size -300k -exec cp {} corpus/ \;
      - name: Fuzz CFB reader (10 min)
        run: build/clang-fuzz/tests/fuzz/Debug/fuzz_cfb corpus -max_total_time=600 -max_len=65536 -rss_limit_mb=2048
      - name: Fuzz AAF document loader (10 min)
        run: build/clang-fuzz/tests/fuzz/Debug/fuzz_document corpus -max_total_time=600 -max_len=300000 -rss_limit_mb=2048
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: |
            crash-*
            oom-*
            timeout-*
            leak-*
