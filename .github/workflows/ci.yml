name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
      - name: clang-format
        run: find libs apps tests -name '*.cpp' -o -name '*.hpp' | xargs clang-format-22 --dry-run --Werror
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tests
        run: |
          pip install -r tools/requirements.txt
          pytest -q tools/tests
      - name: Generated model is up to date
        run: python tools/gen_model.py check
      - name: Generated SMPTE label table is up to date
        run: python tools/gen_labels.py check
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI type check and tests
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
          npx tsc -p e2e

  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++-14
            config: Debug
          - compiler: clang
            cxx: clang++-22
            config: Release
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
        if: matrix.compiler == 'clang'
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install Ninja and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libwebkit2gtk-4.1-dev xvfb
      - name: Configure
        run: cmake --preset ${{ matrix.compiler }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DAAF_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/${{ matrix.compiler }} --config ${{ matrix.config }}
      - name: Test
        run: ctest --test-dir build/${{ matrix.compiler }} -C ${{ matrix.config }} --output-on-failure
      - name: Editor smoke test
        run: xvfb-run -a build/${{ matrix.compiler }}/apps/editor/${{ matrix.config }}/aafedit --smoke-test tests/fixtures/aafsdk/test/com/MemoryLeakTest/RealWorldSample1.aaf
      - name: UI end-to-end tests
        if: matrix.compiler == 'clang'
        working-directory: ui
        env:
          AAFTOOL: ../build/clang/apps/aaftool/Release/aaftool
          AAF_UI_HTML: ../build/clang/apps/editor/ui/index.html
        run: |
          npx playwright install --with-deps chromium webkit
          npm run e2e -- --project chromium --project webkit
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.compiler == 'clang'
        with:
          name: playwright-report-${{ runner.os }}
          path: ui/playwright-report
          retention-days: 7
      - name: clang-tidy
        if: matrix.compiler == 'clang'
        run: run-clang-tidy-22 -p build/clang -quiet -warnings-as-errors='*' 'libs/.*\.cpp' 'apps/.*\.cpp'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset msvc -DAAF_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/msvc --config Release
      - name: Test
        run: ctest --test-dir build/msvc -C Release --output-on-failure
      - name: Editor smoke test
        shell: bash
        run: build/msvc/apps/editor/Release/aafedit.exe --smoke-test tests/fixtures/aafsdk/test/com/MemoryLeakTest/RealWorldSample1.aaf
      - name: UI end-to-end tests
        working-directory: ui
        shell: bash
        env:
          AAFTOOL: ../build/msvc/apps/aaftool/Release/aaftool.exe
          AAF_UI_HTML: ../build/msvc/apps/editor/ui/index.html
        run: |
          npm run e2e -- --project msedge
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ runner.os }}
          path: ui/playwright-report
          retention-days: 7

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake --preset clang -DAAF_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/clang --config Release
      - name: Test
        run: ctest --test-dir build/clang -C Release --output-on-failure
      - name: Editor smoke test
        run: build/clang/apps/editor/Release/aafedit.app/Contents/MacOS/aafedit --smoke-test tests/fixtures/aafsdk/test/com/MemoryLeakTest/RealWorldSample1.aaf
      - name: UI end-to-end tests
        working-directory: ui
        env:
          AAFTOOL: ../build/clang/apps/aaftool/Release/aaftool
          AAF_UI_HTML: ../build/clang/apps/editor/ui/index.html
        run: |
          npx playwright install webkit
          npm run e2e -- --project webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ runner.os }}
          path: ui/playwright-report
          retention-days: 7
